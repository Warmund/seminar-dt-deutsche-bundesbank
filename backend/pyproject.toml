[project]
name = "wz-validierung-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1", "Pillow>=12,<14", "boto3>=1.40,<2", "openai>=2,<3",
  "python-dotenv>=1,<2", "httpx>=0.28,<1", "vercel-queue>=0.10,<0.11"
]

[[tool.vercel.subscribers]]
entrypoint = "run_worker"
